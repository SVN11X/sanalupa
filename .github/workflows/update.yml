name: Revisar y actualizar catálogo
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 2'
permissions:
  contents: read
concurrency:
  group: data-maintenance
  cancel-in-progress: false
jobs:
  update:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - run: npm test
      - name: Actualizar solo proveedor habilitado y revisado
        env:
          ENABLE_OVERPASS: ${{ vars.ENABLE_OVERPASS }}
          APP_URL: ${{ vars.APP_URL }}
        run: npm run update:data
      - name: Resumen sin datos privados
        if: always()
        run: cat reports/update.json >> "$GITHUB_STEP_SUMMARY"
      - name: Propuesta validada para revisión manual
        if: success() && vars.ENABLE_OVERPASS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-para-revision
          path: public/data/catalog.json
          retention-days: 1
