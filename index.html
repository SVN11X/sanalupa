<!doctype html>
<html lang="es-CL">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="referrer" content="strict-origin-when-cross-origin"/>
<meta name="description" content="Busca médicos y centros de salud en el Gran Santiago con valoraciones por fuente, mapa y enlaces de verificación oficial."/>
<link rel="icon" type="image/svg+xml" href="./favicon.svg"/>
<title>Salud Cerca · Santiago</title>
</head>
<body>
<div id="root"></div>
<noscript><p style="font-family:system-ui,sans-serif;padding:24px;max-width:640px;margin:auto;color:#1f2a2e">Esta página necesita JavaScript activado para funcionar.</p></noscript>
<!-- Aviso de respaldo: si la aplicación no dibuja nada en 4 segundos, se explica qué pasó en vez de dejar la pantalla en blanco. -->
<script>
(function(){
  setTimeout(function(){
    var root=document.getElementById('root');
    if(!root||root.childElementCount>0||document.getElementById('fallback-notice'))return;
    var raw=!!document.querySelector('script[type="module"][src$="src/main.tsx"]');
    var box=document.createElement('section');
    box.id='fallback-notice';box.setAttribute('role','alert');
    box.style.cssText='font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:24px;border:2px solid #9a3412;border-radius:12px;background:#fff;color:#1f2a2e;line-height:1.5';
    var h=document.createElement('h1');h.textContent='La página no pudo cargar';h.style.cssText='font-size:1.5rem;margin:0 0 12px';box.appendChild(h);
    var p=document.createElement('p');p.textContent='Recarga la página en unos minutos. Si el problema continúa, avisa a quien administra el sitio.';box.appendChild(p);
    if(raw){
      var a=document.createElement('p');
      a.innerHTML='<strong>Para quien administra el sitio:</strong> GitHub Pages está publicando el código sin compilar. Ve a <strong>Settings</strong>, luego <strong>Pages</strong>, y en <strong>Source</strong> elige <strong>GitHub Actions</strong>. Después ejecuta el workflow «Validar y publicar Pages».';
      box.appendChild(a);
    }
    var r=document.createElement('button');r.type='button';r.textContent='Recargar';r.style.cssText='font:inherit;padding:10px 18px;border-radius:8px;border:0;background:#0f5f63;color:#fff;cursor:pointer';
    r.onclick=function(){location.reload();};box.appendChild(r);
    document.body.insertBefore(box,root);
  },4000);
})();
</script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
